# Run job-radar on a schedule in the cloud — no always-on machine needed.
#
# Setup (one time) — see docs/RUN_ON_GITHUB.md for the full walkthrough:
#   1. Make the repo PUBLIC (free private repos can't run scheduled Actions).
#   2. Repo → Settings → Secrets and variables → Actions:
#        · Secrets tab → add  TELEGRAM_BOT_TOKEN  and  TELEGRAM_CHAT_ID
#        · Variables tab → (optional) add  CONFIG_PATH  to pick which committed
#          search file to run, e.g.  profiles/payments.yaml  or  profiles/ml.yaml
#          Leave it unset and the run falls back to config.yaml → config.example.yaml.
#   (config.yaml is gitignored, so the cloud run uses a COMMITTED file: either a
#    profile you point CONFIG_PATH at, or config.example.yaml. Edit & commit that
#    file to change your cloud search — no secrets ever go in it.)
#
# The "seen" SQLite DB is restored/saved via actions/cache so you aren't
# re-alerted every run. Cache is best-effort (GitHub evicts after ~7 days of
# disuse); a rare duplicate after a long idle gap is the worst case.
#
# NOTE: GitHub auto-disables scheduled workflows after 60 days with no repo
# activity, and disables them on new forks until you enable Actions. Both are a
# single click (Actions tab); editing your search file also resets the 60-day clock.

name: job-radar

on:
  schedule:
    - cron: "0 * * * *"      # hourly (UTC). Change to taste, e.g. "*/30 * * * *"
  workflow_dispatch:           # also allow manual runs from the Actions tab
    inputs:
      seed:
        description: "Seed a silent baseline (mark current postings as seen, send nothing)"
        type: boolean
        default: false

concurrency:
  group: job-radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore "seen" state
        uses: actions/cache@v4
        with:
          path: data
          key: jobradar-state-${{ github.run_id }}
          restore-keys: jobradar-state-

      - name: Run one pass
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CONFIG_PATH: ${{ vars.CONFIG_PATH }}
          SEED_INPUT: ${{ github.event.inputs.seed }}
        # CONFIG_PATH (a repo Variable) picks which committed search to run;
        # unset -> run.py falls back to config.yaml -> config.example.yaml.
        #
        # Seed-on-first-run: if no "seen" DB was restored from cache (the very
        # first cloud run), establish a silent baseline instead of alerting on
        # every currently-open posting. You can also force a reseed anytime via
        # Actions -> Run workflow -> tick "seed". Normal runs after that.
        run: |
          mkdir -p data
          CFG=""
          [ -n "$CONFIG_PATH" ] && CFG="--config $CONFIG_PATH"
          if [ "$SEED_INPUT" = "true" ]; then
            echo "Seed requested -> silent baseline; no alerts this run."
            python run.py $CFG --seed -v
          elif [ "$SEED_INPUT" = "false" ]; then
            # Manual "Run workflow" with seed unchecked: a real run even from an
            # empty state, so you can force-deliver a backlog (e.g. to recover
            # after a bad-token run swallowed jobs).
            echo "Manual run (seed unchecked) -> normal pass; will deliver unseen matches."
            python run.py $CFG -v
          elif [ -z "$(ls -A data/*.db 2>/dev/null)" ]; then
            # Scheduled run with no prior state = genuine first run -> seed so we
            # don't flood with everything currently open.
            echo "No prior state on a scheduled run -> seeding a silent baseline."
            python run.py $CFG --seed -v
          else
            python run.py $CFG -v
          fi
