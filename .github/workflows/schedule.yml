# Run job-radar on a schedule in the cloud — no always-on machine needed.
#
# Setup (one time):
#   1. Make the repo PUBLIC (free private repos can't run scheduled Actions).
#   2. Repo → Settings → Secrets and variables → Actions → add:
#        TELEGRAM_BOT_TOKEN   TELEGRAM_CHAT_ID
#   3. Commit your search as config.yaml OR rely on config.example.yaml.
#      (config.yaml is gitignored by default — if you want the cloud run to use
#       your personal search, either un-ignore it or copy it into the repo.)
#
# The "seen" SQLite DB is restored/saved via actions/cache so you aren't
# re-alerted every run. Cache is best-effort (GitHub evicts after ~7 days of
# disuse); a rare duplicate after a long idle gap is the worst case.

name: job-radar

on:
  schedule:
    - cron: "0 * * * *"      # hourly (UTC). Change to taste, e.g. "*/30 * * * *"
  workflow_dispatch: {}        # also allow manual runs from the Actions tab

concurrency:
  group: job-radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore "seen" state
        uses: actions/cache@v4
        with:
          path: data
          key: jobradar-state-${{ github.run_id }}
          restore-keys: jobradar-state-

      - name: Run one pass
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run.py -v
